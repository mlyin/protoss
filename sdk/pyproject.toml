[project]
name = "arena-sdk"
version = "0.1.0"
description = "Python client for the Arena agent exchange layer on Hyperliquid"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arena*"]
