    <path class="outline" d="M147 157 172 142 211 154 215 188 186 220 160 230 140 204Z" fill="url(#p0-ivory)"/>
    <ellipse class="outline" cx="178" cy="180" rx="36" ry="43" transform="rotate(23 178 180)" fill="#976726"/>
    <ellipse cx="178" cy="180" rx="29" ry="36" transform="rotate(23 178 180)" fill="url(#p0-crystal)" stroke="#123b52" stroke-width="4"/>
    <path d="m175 149-18 28 15 28 24-22Z" fill="#b8fbff" opacity=".62"/>
    <path d="m175 149 5 29 16 5m-39-6 23 1-8 27" fill="none" stroke="#e7ffff" stroke-width="2" opacity=".6"/>
    <ellipse cx="169" cy="157" rx="6" ry="9" transform="rotate(25 169 157)" fill="#fff" opacity=".85"/>
    <ellipse class="outline" cx="101" cy="168" rx="21" ry="28" transform="rotate(18 101 168)" fill="url(#p0-gold)"/>
    <ellipse cx="102" cy="168" rx="11" ry="18" transform="rotate(18 102 168)" fill="url(#p0-crystal)" stroke="#123b52" stroke-width="3"/>
    <path class="outline" d="M91 98Q39 122 37 184Q36 222 65 247Q47 204 65 171Q73 156 86 145Z" fill="url(#p0-gold)"/>
    <path d="M73 129Q46 161 48 194L58 168Z" fill="#5de8ff" stroke="#267b91" stroke-width="2"/>
    <path class="outline" d="M234 106Q278 132 281 181Q282 221 251 253Q266 213 249 188L227 167Z" fill="url(#p0-gold)"/>
    <path d="M254 143Q273 165 269 199L260 174Z" fill="#5de8ff" stroke="#267b91" stroke-width="2"/>
    <path class="outline" d="m139 229 17-9 25 13-5 17-18 7-22-12Z" fill="url(#p0-gold)"/>
    <ellipse cx="158" cy="244" rx="14" ry="6" fill="#56e4ff" stroke="#123b52" stroke-width="3"/>
    <path d="m158 248 10 10-10 15-10-15Z" fill="url(#p0-crystal)" stroke="#8ff2ff" stroke-width="2"/>
  </g>
  <g class="thinking-effects" fill="#69dff6" stroke="#205063" stroke-width="2">
    <circle class="thought" cx="234" cy="76" r="5"/><circle class="thought second" cx="254" cy="58" r="8"/>
    <g class="thought third"><path d="M261 27Q274 15 287 27Q299 40 286 51Q276 59 263 49Q251 40 261 27Z" fill="#e1fbff"/><path d="M266 37h18" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/></g>
  </g>
  <g class="success-effects"><circle cx="254" cy="66" r="26" fill="#dbf8e9" stroke="#2f8a65" stroke-width="3"/><path class="check" d="m242 66 8 8 16-18" fill="none" stroke="#2f8a65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="talking-effects"><path d="M218 25h64q15 0 15 15v22q0 15-15 15h-29l-18 15 3-15h-20q-15 0-15-15V40q0-15 15-15Z" fill="#e1fbff" stroke="#205063" stroke-width="3"/>
    <g fill="#168db2"><circle class="speech-dot" cx="230" cy="51" r="4"/><circle class="speech-dot two" cx="250" cy="51" r="4"/><circle class="speech-dot three" cx="270" cy="51" r="4"/></g></g>
</svg>
