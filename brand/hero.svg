<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Two Protoss Probes talking"><svg xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="320" height="320" viewBox="0 0 320 320" class="probe talking" role="img" aria-labelledby="p0-title">
  <title id="p0-title">Protoss Probe, hovering</title>
  <defs>
    <linearGradient id="p0-gold" x2=".8" y2="1"><stop stop-color="#fff0b2"/><stop offset=".45" stop-color="#edbd51"/><stop offset="1" stop-color="#a66b23"/></linearGradient>
    <linearGradient id="p0-ivory" x2=".8" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#d8caa3"/></linearGradient>
    <radialGradient id="p0-crystal" cx=".3" cy=".25"><stop stop-color="#e5ffff"/><stop offset=".4" stop-color="#5ae7ff"/><stop offset="1" stop-color="#087fbc"/></radialGradient>
    <linearGradient id="p0-beam" x2="0" y2="1"><stop stop-color="#59dfff" stop-opacity=".6"/><stop offset="1" stop-color="#59dfff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .outline{stroke:#453221;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .float{transform-origin:160px 150px;animation:hover 4s ease-in-out infinite}
    .shadow{transform-origin:160px 285px;animation:shadow 4s ease-in-out infinite}
    .thinking-effects,.talking-effects,.working-effects,.success-effects{display:none}
    .thinking .thinking-effects,.working .working-effects,.success .success-effects{display:inline}
    .talking .talking-effects{display:inline}.talking .float{animation:ponder 2.4s ease-in-out infinite}
    .talking .speech-dot{animation:thought 1.5s ease-in-out infinite}.talking .speech-dot.two{animation-delay:.25s}.talking .speech-dot.three{animation-delay:.5s}
    .thinking .float{animation:ponder 3s ease-in-out infinite}
    .thinking .thought{animation:thought 1.8s ease-in-out infinite}
    .thinking .thought.second{animation-delay:.25s}.thinking .thought.third{animation-delay:.5s}
    .working .float{animation:work 1.8s ease-in-out infinite}
    .working .build-ring{transform-origin:160px 277px;animation:spin 4s linear infinite}
    .working .spark{animation:thought 1s ease-in-out infinite}
    .success .check{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .6s ease-out forwards}
    @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.13}50%{transform:scaleX(.85);opacity:.08}}
    @keyframes ponder{0%,100%{transform:translateY(-3px) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
    @keyframes thought{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @keyframes work{0%,100%{transform:translateY(-3px)}50%{transform:translateY(1px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.float,.shadow,.thought,.speech-dot,.build-ring,.spark,.check{animation:none!important}.check{stroke-dashoffset:0}}
  </style>
